
name: Unit Tests + Publish Maven Central

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Compile Stock Management
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        run: mvn -B -pl api test

      - name: Upload Jacoco coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-jacoco-report
          path: api/target/site/jacoco

  backend-smoke:
    runs-on: ubuntu-latest
    needs: compile
    if: github.event_name == 'pull_request'
    permissions:
      contents: read

    steps:
      - name: Check out Stock Management
        uses: actions/checkout@v4
        with:
          path: stockmanagement

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Install Stock Management locally
        working-directory: stockmanagement
        run: mvn -B clean install -DskipTests

      - name: Read Stock Management version
        id: stock
        working-directory: stockmanagement
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Check out SIHSALUS backend
        uses: actions/checkout@v4
        with:
          repository: sihsalus/sihsalus
          path: sihsalus

      - name: Point backend to this stock management build
        working-directory: sihsalus
        run: |
          sed -i "s/<stockmanagement.version>[^<]*<\/stockmanagement.version>/<stockmanagement.version>${{ steps.stock.outputs.version }}<\/stockmanagement.version>/" backend/pom.xml

      - name: Build backend with PR Stock Management
        working-directory: sihsalus
        run: mvn -B -s backend/credentials/settings.xml.template -P backend -pl backend install

  publish:
    runs-on: ubuntu-latest
    needs: compile
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven

      - name: Check associated merged PR
        id: merged-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "This run is eligible for publish."
            exit 0
          fi
          PR_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null)] | length')
          if [ "$PR_COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Commit is associated with a merged pull request."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Commit is not associated with a merged pull request; skipping publish."
          fi

      - name: Set up Maven Central credentials
        if: steps.merged-pr.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 8
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Validate GPG key import
        if: steps.merged-pr.outputs.exists == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is empty"
            exit 1
          fi
          if [ -z "${GPG_PASSPHRASE:-}" ]; then
            echo "::error::GPG_PASSPHRASE is empty"
            exit 1
          fi
          printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/gpg_private_key.asc
          gpg --batch --import /tmp/gpg_private_key.asc
          KEY_ID=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')
          if [ -z "$KEY_ID" ]; then
            echo "::error::No se pudo importar una clave privada desde GPG_PRIVATE_KEY"
            exit 1
          fi
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          printf 'test-signature' > /tmp/gpg-signature-test.txt
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$KEY_ID" --detach-sign /tmp/gpg-signature-test.txt

      - name: Check Maven Central version
        id: central-version
        if: steps.merged-pr.outputs.exists == 'true'
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          URL="https://repo1.maven.org/maven2/io/github/proyecto-santaclotilde/stockmanagement-omod/${VERSION}/stockmanagement-omod-${VERSION}.pom"
          if curl -fsI "$URL" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists in Maven Central; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} is not in Maven Central; publishing."
          fi

      - name: Publish to Maven Central
        if: >-
          steps.merged-pr.outputs.exists == 'true' &&
          steps.central-version.outputs.exists == 'false'
        run: mvn -B -P release deploy -DskipTests -Dgpg.useAgent=false -Dgpg.passphrase="${GPG_PASSPHRASE}" -Dgpg.keyname="${GPG_KEY_ID}"
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
